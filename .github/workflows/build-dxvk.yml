name: Build DXVK gaze-VRS + OpenXR bridge

on:
  workflow_dispatch:
    inputs:
      dxvk_ref:
        description: 'DXVK commit, tag or branch to build on; empty = the commit pinned by the dxvk submodule'
        required: false
        default: ''
        type: string
      variant:
        description: 'Or: a GE-Proton or proton-cachyos release (e.g. GE-Proton11-12) to build for, with its DXVK patches'
        required: false
        default: ''
        type: string
      release_tag:
        description: 'Optional: create a GitHub Release with this tag (e.g. v1.0-gaze-vrs)'
        required: false
        default: ''
        type: string
  push:
    tags:
      - 'v*'

jobs:
  dxvk:
    name: Build DXVK (Windows DLLs)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # The same container image and script as a local build.
      - name: Build
        env:
          DXVK_REF: ${{ inputs.dxvk_ref }}
          VARIANT: ${{ inputs.variant }}
        run: bash scripts/dev-container.sh build ${DXVK_REF:+--ref "$DXVK_REF"} ${VARIANT:+--variant "$VARIANT"}

      - name: Collect DLLs
        run: |
          mkdir -p dist-dxvk
          cp dist/dxvk*/d3d11.dll dist/dxvk*/dxgi.dll dist-dxvk/
          version="$(scripts/proton.py dll-version dist-dxvk/d3d11.dll)"
          [[ "$version" == *-dfr.* ]] || { echo "No gaze DXVK version in d3d11.dll" >&2; exit 1; }
          echo "$version"

      - uses: actions/upload-artifact@v4
        with:
          name: dxvk-gaze-vrs
          path: dist-dxvk/

  gaze:
    name: Build and test native OpenXR gaze bridge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenxr-dev pkg-config python3
      - name: Test projection, shared memory and OpenXR lifecycle
        run: bash scripts/test-gaze-bridge.sh
      # In the pinned Ubuntu 24.04 image, like a local build.
      - name: Build
        run: bash scripts/dev-container.sh bridge
      - uses: actions/upload-artifact@v4
        with:
          name: openxr-gaze-bridge-linux-x86_64
          path: dist/gaze/

  release:
    name: Publish release
    needs: [dxvk, gaze]
    if: |
      always()
      && needs.dxvk.result == 'success'
      && needs.gaze.result == 'success'
      && (github.event_name == 'push' || inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Install zip
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Download DXVK artifact
        uses: actions/download-artifact@v4
        with:
          name: dxvk-gaze-vrs
          path: release/dxvk-gaze-vrs

      - name: Download gaze bridge artifact
        uses: actions/download-artifact@v4
        with:
          name: openxr-gaze-bridge-linux-x86_64
          path: release/openxr-gaze-bridge

      - name: Package
        run: |
          cd release
          zip -r dxvk-gaze-vrs.zip dxvk-gaze-vrs
          chmod +x openxr-gaze-bridge/openxr-gaze-bridge openxr-gaze-bridge/dfrctl
          zip -r openxr-gaze-bridge-linux-x86_64.zip openxr-gaze-bridge
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          body: |
            Experimental gaze-driven VRS build.

            - DXVK base: `${{ inputs.variant || inputs.dxvk_ref || 'the commit pinned by the dxvk submodule' }}`
            - Gaze: native Linux OpenXR headless bridge for an unmodified OpenXR runtime

            See README for install and VRChat launch configuration.
          files: |
            release/dxvk-gaze-vrs.zip
            release/openxr-gaze-bridge-linux-x86_64.zip
          fail_on_unmatched_files: true
