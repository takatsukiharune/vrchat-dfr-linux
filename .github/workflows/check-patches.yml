name: Patch sanity checks

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Patches apply to the pinned DXVK commit
        run: bash scripts/dxvk-patches.sh check
      - name: Install gaze test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libopenxr-dev python3
      - name: Test gaze projection, IPC, OpenXR lifecycle, dfrctl and the installer
        run: bash scripts/test-gaze-bridge.sh
