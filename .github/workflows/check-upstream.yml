name: Patches against current DXVK

# Tells us the day an upstream change or a new GE-Proton or proton-cachyos
# release breaks the patch series, instead of when someone tries to build for it.
on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0
      - name: Apply to DXVK master and to the latest GE-Proton and proton-cachyos, on top of their DXVK patches
        run: |
          source scripts/lib.sh
          ge="$(latest_variant 'GE-Proton*')"
          cachyos="$(latest_variant 'cachyos-*-slr')"
          echo "Latest releases: $ge, $cachyos"
          bash scripts/dxvk-patches.sh check master "$ge" "$cachyos"
